apiVersion: v1
kind: Service
metadata:
  name: flask-api
  namespace: msc-de1-project
  labels:
    app.kubernetes.io/name: flask-api
    app.kubernetes.io/part-of: msc-de1-distributed-systems
spec:
  type: ClusterIP
  selector:                     # same labels as the Deployment's pod template
    app.kubernetes.io/name: flask-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http          # named container port (8000)
      protocol: TCP
