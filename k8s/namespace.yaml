apiVersion: v1
kind: Namespace
metadata:
  name: msc-de1-project
  labels:
    app.kubernetes.io/part-of: msc-de1-distributed-systems
    # Pod Security Admission: reject any pod that does not meet the
    # "restricted" profile (non-root, no privilege escalation, caps dropped,
    # seccomp RuntimeDefault...). Enforced by the API server itself.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
