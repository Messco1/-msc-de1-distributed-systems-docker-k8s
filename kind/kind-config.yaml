# kind cluster: 1 control-plane + 2 workers
#   kind create cluster --config kind/kind-config.yaml
# kind >= v0.24 ships kindnet with NetworkPolicy support, so the policies in
# k8s/network-policy.yaml are enforced without installing another CNI.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: msc-de1
nodes:
  - role: control-plane
    labels:
      project: msc-de1
  - role: worker
    labels:
      project: msc-de1
      tier: app
  - role: worker
    labels:
      project: msc-de1
      tier: app
